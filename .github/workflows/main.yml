name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      # অটো প্রজেক্ট স্ট্রাকচার ফিক্স করার জন্য এই কমান্ডটি দেওয়া হলো
      - run: flutter create . --org com.aparajita.delivery --project-name aparajita_delivery --platforms=android
      
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
